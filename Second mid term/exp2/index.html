<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily To-Do List</title>
<style>
  body { font-family: Arial, sans-serif; background: #f2f2f2; margin: 0; padding: 30px; }
  .card { max-width: 480px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  h1 { text-align: center; font-size: 24px; margin-top: 0; }
  .row { display: flex; gap: 10px; }
  #taskInput { flex: 1; padding: 10px; font-size: 15px; border: 2px solid #222; border-radius: 3px; }
  #addBtn { padding: 10px 18px; background: #555; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 15px; }
  ul { list-style: none; padding: 0; margin: 16px 0 0; }
  li { display: flex; justify-content: space-between; align-items: center; padding: 12px 4px; border-bottom: 1px solid #ddd; }
  .text { cursor: pointer; flex: 1; }
  .done { color: grey; text-decoration: line-through; }
  .del { background: #555; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 13px; }
  #status { margin-top: 16px; color: #444; }
</style>
</head>
<body>
  <div class="card">
    <h1>My To-Do List</h1>
    <div class="row">
      <input type="text" id="taskInput" placeholder="Enter a task">
      <button id="addBtn">Add</button>
    </div>
    <ul id="list"></ul>
    <div id="status"></div>
  </div>

<script>
  var tasks = [];   // each task: { text: "...", done: false }

  var input = document.getElementById("taskInput");
  var list = document.getElementById("list");
  var statusBox = document.getElementById("status");

  function addTask() {
    var value = input.value.trim();
    if (value === "") return;            // ignore empty input
    tasks.push({ text: value, done: false });
    input.value = "";
    render();
  }

  function render() {
    list.innerHTML = "";

    for (var i = 0; i < tasks.length; i++) {
      (function (index) {
        var li = document.createElement("li");

        var span = document.createElement("span");
        span.className = "text" + (tasks[index].done ? " done" : "");
        span.textContent = tasks[index].text;
        span.addEventListener("click", function () {
          tasks[index].done = !tasks[index].done;   // toggle
          render();
        });

        var btn = document.createElement("button");
        btn.className = "del";
        btn.textContent = "Delete";
        btn.addEventListener("click", function () {
          tasks.splice(index, 1);                    // remove from array
          render();
        });

        li.appendChild(span);
        li.appendChild(btn);
        list.appendChild(li);
      })(i);
    }

    if (tasks.length === 0) {
      statusBox.textContent = "No tasks yet. Add one above!";
    } else {
      var remaining = 0;
      for (var j = 0; j < tasks.length; j++) {
        if (!tasks[j].done) remaining++;
      }
      statusBox.textContent = remaining + " of " + tasks.length + " tasks remaining";
    }
  }

  document.getElementById("addBtn").addEventListener("click", addTask);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") addTask();
  });

  render();
</script>
</body>
</html>
