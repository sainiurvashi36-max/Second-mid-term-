<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurant Bill Splitter</title>
<style>
  body { font-family: Arial, sans-serif; background: #f2f2f2; margin: 0; padding: 30px; }
  .card { max-width: 420px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  h1 { text-align: center; font-size: 22px; margin-top: 0; }
  label { display: block; margin: 14px 0 6px; font-weight: bold; }
  input, select { width: 100%; padding: 9px; font-size: 15px; box-sizing: border-box; border: 1px solid #aaa; border-radius: 4px; }
  button { width: 100%; margin-top: 18px; padding: 11px; font-size: 16px; background: #333; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  button:hover { background: #111; }
  #error { color: red; margin-top: 14px; font-weight: bold; }
  #result p { margin: 6px 0; font-size: 16px; }
  #result { margin-top: 14px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Restaurant Bill Splitter</h1>

    <label for="bill">Bill amount (Rs.)</label>
    <input type="number" id="bill" placeholder="e.g. 1200">

    <label for="tip">Tip</label>
    <select id="tip">
      <option value="0">0%</option>
      <option value="5">5%</option>
      <option value="10">10%</option>
      <option value="15">15%</option>
    </select>

    <label for="people">Number of people</label>
    <input type="number" id="people" value="1">

    <button id="calcBtn">Calculate</button>

    <div id="error"></div>
    <div id="result"></div>
  </div>

<script>
  document.getElementById("calcBtn").addEventListener("click", function () {
    var bill = parseFloat(document.getElementById("bill").value);
    var tipPercent = parseFloat(document.getElementById("tip").value);
    var people = parseInt(document.getElementById("people").value);

    var errorBox = document.getElementById("error");
    var resultBox = document.getElementById("result");
    errorBox.textContent = "";
    resultBox.innerHTML = "";

    // Validation: bill empty / not above 0, or people < 1
    if (isNaN(bill) || bill <= 0) {
      errorBox.textContent = "Please enter a valid bill amount greater than 0.";
      return;
    }
    if (isNaN(people) || people < 1) {
      errorBox.textContent = "Number of people must be at least 1.";
      return;
    }

    var tipAmount = bill * tipPercent / 100;
    var total = bill + tipAmount;
    var perPerson = total / people;

    resultBox.innerHTML =
      "<p>Tip amount: Rs. " + tipAmount.toFixed(2) + "</p>" +
      "<p>Total bill: Rs. " + total.toFixed(2) + "</p>" +
      "<p>Each person pays: Rs. " + perPerson.toFixed(2) + "</p>";
  });
</script>
</body>
</html>
